<!doctype html>
<html>
<head><meta charset="utf-8"><title>SignalR Test</title></head>
<body>
  <h1>SignalR Biblioteca</h1>
  <pre id="log"></pre>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script>
    const log = (msg) => document.getElementById('log').textContent += msg + "\n";

    const connection = new signalR.HubConnectionBuilder()
      .withUrl("http://localhost:5023/hubs/library") // cambia XXXX por tu puerto https
      .withAutomaticReconnect()
      .build();

    connection.on("BookCreated", data => log("BookCreated: " + JSON.stringify(data)));
    connection.on("BookStockUpdated", data => log("BookStockUpdated: " + JSON.stringify(data)));
    connection.on("JoinedRoom", room => log("JoinedRoom: " + room));

    connection.start()
      .then(() => connection.invoke("JoinRoom", "general"))
      .then(() => log("Conectado"))
      .catch(err => log("Error: " + err));
  </script>
</body>
</html>
